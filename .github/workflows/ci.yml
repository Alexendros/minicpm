name: ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-rag.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "22" }
      - name: bash -n
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: python compile + ast
        run: |
          python -m compileall -q app scripts
          python - <<'PY'
          import ast, pathlib
          for p in list(pathlib.Path("app").glob("*.py")) + list(pathlib.Path("scripts").glob("*.py")):
              ast.parse(p.read_text(), filename=str(p))
          PY
      - name: ruff
        run: pip install ruff==0.14.5 && ruff check app scripts
      - name: node --check + eslint
        run: |
          node --check app/static/app.js
          npx eslint@9 app/static/app.js
      - name: systemd verify
        run: |
          mkdir -p "$HOME/minicpm/scripts"
          ln -sf "$PWD"/scripts/*.sh "$HOME/minicpm/scripts/"
          touch "$HOME/minicpm/scripts/env.list"
          for u in systemd/*.service; do systemd-analyze verify "$u"; done
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: sin rutas de usuario
        run: |
          ! grep -rnE '/home/[a-z]' scripts systemd app README.md docs \
            --exclude='*.example' --exclude-dir='__pycache__'
      - name: secretos solo placeholder
        run: |
          ! grep -nE '(_KEY|_PASS|_TOKEN|_SECRET)=["'"'"']?[A-Za-z0-9_\-]{12,}' \
            scripts/env.sh scripts/env.list.example
      - name: markdownlint
        run: npx markdownlint-cli@0.45 "docs/**/*.md" README.md
      - name: unit sin LLM
        run: |
          pip install pytest fastapi pydantic numpy httpx python-multipart
          MINICPM_HOME="$RUNNER_TEMP/m" pytest tests/unit -q

  conventions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0 }
      - name: titulo del PR
        run: |
          echo "${{ github.event.pull_request.title }}" | grep -qE '^plan [0-9]+(\.[0-9]+)?: .+'
      - name: mensajes de commit
        run: |
          git log --format=%s origin/main..HEAD | grep -vE '^(plan [0-9]+(\.[0-9]+)?: |Merge )' && exit 1 || true
      - name: tamano del PR
        run: |
          LINES=$(git diff --numstat origin/main...HEAD -- . ':!docs' ':!*.lock' | awk '{a+=$1; d+=$2} END {print a+d}')
          echo "cambios: ${LINES:-0} lineas"
          [ "${LINES:-0}" -le 800 ]
      - name: fichero nuevo
        run: |
          for f in $(git diff --diff-filter=A --name-only origin/main...HEAD -- . ':!docs'); do
            n=$(wc -l < "$f")
            echo "nuevo: $f ($n lineas)"
            [ "$n" -le 500 ]
          done
      - name: tamano de fichero
        run: |
          for f in $(git diff --name-only origin/main...HEAD); do
            [ -f "$f" ] || continue
            sz=$(stat -c%s "$f")
            [ "$sz" -le 5242880 ] || { echo "fichero >5MiB: $f"; exit 1; }
          done
      - name: paths prohibidos
        run: |
          git diff --name-only origin/main...HEAD | \
            grep -E '^(models/|venv-|src/llama\.cpp/|bin/|logs/|app/data/)|\.(gguf|safetensors|bin)$' \
            && exit 1 || true